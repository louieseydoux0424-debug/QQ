name: Mirror NapCat to GHCR

on:
  workflow_dispatch: {}

permissions:
  packages: write
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull, tag and push NapCat
        run: |
          docker pull mlikiowa/napcat-docker:latest
          docker tag mlikiowa/napcat-docker:latest ghcr.io/${{ github.repository_owner }}/napcat-docker:latest
          docker push ghcr.io/${{ github.repository_owner }}/napcat-docker:latest
