name: Export NapCat as chunks

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull, save, split
        run: |
          docker pull mlikiowa/napcat-docker:latest
          rm -rf chunks && mkdir -p chunks
          docker save mlikiowa/napcat-docker:latest | gzip | split -b 80M -d - chunks/napcat.tar.gz.part
          ls -lh chunks/

      - name: Commit and push chunks
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add chunks/
          git commit -m "Add napcat image chunks" || echo "no changes"
          git push
